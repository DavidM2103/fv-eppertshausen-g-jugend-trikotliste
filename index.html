<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FV Eppertshausen · G-Jugend</title><style>:root{--r:#c91412;--bg:#f3f3f3}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#222}.top{height:58px;background:#fff;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:3}.menu{font-size:23px;border:0;background:none;margin-right:14px}.hero{background:var(--r);color:#fff;padding:18px}.main{max-width:1180px;margin:auto;padding:14px}.drawer{position:fixed;z-index:5;top:0;bottom:0;left:0;width:300px;background:#fff;transform:translateX(-100%);transition:.2s;box-shadow:3px 0 20px #0004;padding-top:60px}.drawer.open{transform:none}.drawer button{width:100%;border:0;background:#fff;padding:14px 20px;text-align:left;font-weight:bold}.drawer button.active{background:#f8e9e9;color:var(--r);border-right:3px solid var(--r)}.tab{display:none}.tab.active{display:block}.panel{background:#fff;border:1px solid #e5e5e5;border-radius:5px;margin-bottom:12px;overflow:hidden}.head{padding:11px 13px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px;align-items:center}.toolbar{display:flex;gap:7px}.btn{border:1px solid #ddd;background:#fff;border-radius:4px;padding:8px 11px;font-size:11px;font-weight:bold}.red{background:var(--r);color:#fff;border-color:var(--r)}.form{padding:12px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr 140px 110px 120px;gap:8px}.field label{display:block;font-size:10px;font-weight:bold;margin-bottom:4px}.field input,.field select{width:100%;height:32px;border:1px solid #ddd;border-radius:4px;padding:5px}.actions{text-align:right;margin-top:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th{background:var(--r);color:#fff;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid #eee}.card{margin:10px;padding:12px;border:1px solid #eee;border-left:4px solid var(--r);border-radius:4px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10}.modal.show{display:flex}.modalbox{background:#fff;width:min(550px,92%);border-radius:6px;padding:16px}.checklist label{display:inline-flex;gap:5px;margin:5px;padding:7px;border:1px solid #ddd;border-radius:4px;font-size:10px}.overview-stats{padding:12px;border-bottom:1px solid #eee;font-size:13px;line-height:1.8}.attendance-list{padding:0 12px 12px}.attendance-list h3{font-size:14px;margin:14px 0 8px}.attendance-row{display:flex;justify-content:space-between;align-items:center;padding:10px 8px;border-bottom:1px solid #eee;font-size:12px}.attendance-row:last-child{border-bottom:0}.attendance-value{font-weight:bold}.attendance-percent{color:#666;font-size:11px;margin-left:7px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.toolbar input{width:100px!important}.attendance-row{font-size:11px}}</style></head><body><header class="top"><button class="menu" onclick="toggleMenu()">☰</button><b>⚽ FV Eppertshausen · G-Jugend</b></header><aside id="drawer" class="drawer"><button data-tab="players" class="active">👤 Spieler</button><button data-tab="trainingParticipants">✓ Trainingsteilnehmer</button><button data-tab="trainingHistory">📅 Training</button><button data-tab="events">⚽ Spielfeste</button><button data-tab="overview">◉ Übersicht</button><button data-tab="settings">⚙ Einstellungen</button></aside><section class="hero"><h2 id="title">Spieler</h2></section><main class="main"><section id="players" class="tab active"><div class="panel"><div class="head"><b>Spieler</b><div class="toolbar"><input id="search" placeholder="Suchen..."><button class="btn red" onclick="openPlayer()">＋ Spieler hinzufügen</button></div></div><div id="playerForm" class="form hidden"><div class="grid"><div class="field"><label>Vorname</label><input id="first"></div><div class="field"><label>Nachname</label><input id="last"></div><div class="field"><label>Geburtsdatum</label><input id="birthdate" type="date"></div><div class="field"><label>Größe</label><select id="size"><option>116</option><option>122</option><option>128</option><option>134</option><option>140</option><option>146</option><option>152</option><option>158</option><option>164</option></select></div><div class="field"><label>Trikot-Nr.</label><input id="number" type="number"></div></div><div class="actions"><button class="btn" onclick="closePlayer()">Abbrechen</button> <button class="btn red" onclick="savePlayer()">Speichern</button></div></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Geburtsdatum</th><th>Größe</th><th>Nr.</th><th>Trainings</th><th>Anwesend</th><th>Aktion</th></tr></thead><tbody id="playersBody"></tbody></table></div></div></section><section id="trainingParticipants" class="tab"><div class="panel"><div class="head"><b>Trainingsteilnehmer</b><button class="btn red" onclick="newTraining()">＋ Neues Training</button></div><div class="form"><input id="date" type="date"> <button class="btn" onclick="saveTraining()">Speichern</button></div><div id="attendance"></div></div></section><section id="trainingHistory" class="tab"><div class="panel"><div class="head"><b>Training</b></div><div id="trainingList"></div></div></section><section id="events" class="tab"><div class="panel"><div class="head"><b>Spielfeste</b><div><a class="btn" target="_blank" href="https://www.fussball.de/spieltag/festival-11-kreis-dieburg-g-junioren-kinderfussball-g-junioren-saison2627-hessen/-/staffel/031PBPQQTS00000AVS5489BUVSV0FPBG-G#!/">FUSSBALL.DE</a> <button class="btn red" onclick="openEvent()">＋ Spielfest</button></div></div><div id="eventForm" class="form hidden"><div class="grid"><div class="field"><label>Datum</label><input id="eventDate" type="date"></div><div class="field"><label>Ort</label><input id="eventLocation"></div><div class="field"><label>Beginn</label><input id="eventTime" type="time"></div></div><div id="eventPlayers" class="checklist"></div><div class="actions"><button class="btn" onclick="closeEvent()">Abbrechen</button> <button class="btn red" onclick="saveEvent()">Speichern</button></div></div><div id="eventList"></div></div></section><section id="overview" class="tab"><div class="panel"><div class="head"><b>Übersicht</b></div><div id="overviewList"></div></div></section><section id="settings" class="tab"><div class="panel"><div class="head"><b>Einstellungen</b></div><div class="form">Die Mannschaftsdaten werden lokal auf diesem Gerät gespeichert.</div></div></section></main><div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="modalbox"><button style="float:right" onclick="closeModal()">×</button><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div><script>const K='fv_eppertshausen_gj_v6';let state=JSON.parse(localStorage.getItem(K)||'null')||{players:[],trainings:[],events:[]},editId=null,eventEditId=null;if(!Array.isArray(state.players))state.players=[];if(!Array.isArray(state.trainings))state.trainings=[];if(!Array.isArray(state.events))state.events=[];state.players.forEach(p=>{if(p.birthdate===undefined)p.birthdate=''});function save(){localStorage.setItem(K,JSON.stringify(state));render()}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function pname(p){return(p.first+' '+p.last).trim()}function fmt(d){if(!d)return'—';let a=d.split('-');return a.length===3?a[2]+'.'+a[1]+'.'+a[0]:d}function stats(id){let a=state.trainings.filter(t=>t.attendance&&id in t.attendance),p=a.filter(t=>t.attendance[id]).length;return{total:a.length,present:p}}function renderPlayers(){let q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('playersBody').innerHTML=state.players.filter(p=>pname(p).toLowerCase().includes(q)).map(p=>{let s=stats(p.id);return`<tr><td>${esc(pname(p))}</td><td>${fmt(p.birthdate)}</td><td>${esc(p.size)}</td><td>${esc(p.number)}</td><td>${s.total}</td><td>${s.present}</td><td><button onclick="editPlayer('${p.id}')">✎</button> <button onclick="removePlayer('${p.id}')">×</button></td></tr>`}).join('')||'<tr><td colspan="7">Noch keine Spieler angelegt.</td></tr>'}function openPlayer(p){editId=p?.id||null;playerForm.classList.remove('hidden');first.value=p?.first||'';last.value=p?.last||'';birthdate.value=p?.birthdate||'';size.value=p?.size||'128';number.value=p?.number||''}function editPlayer(id){openPlayer(state.players.find(p=>p.id===id))}function closePlayer(){playerForm.classList.add('hidden');editId=null}function savePlayer(){let p={id:editId||uid(),first:first.value.trim(),last:last.value.trim(),birthdate:birthdate.value,size:size.value,number:number.value};if(!p.first&&!p.last)return;if(editId){let i=state.players.findIndex(x=>x.id===editId);state.players[i]=p}else state.players.push(p);closePlayer();save()}function removePlayer(id){state.players=state.players.filter(p=>p.id!==id);state.trainings.forEach(t=>delete t.attendance?.[id]);state.events.forEach(e=>e.players=(e.players||[]).filter(x=>x!==id));save()}function currentTraining(){return state.trainings.find(t=>t.date===date.value)}function renderParticipants(){let t=currentTraining();attendance.innerHTML=state.players.map(p=>`<div class="card"><b>${esc(pname(p))}</b> <button class="btn" onclick="toggleAttendance('${p.id}')">${t?.attendance?.[p.id]?'✓ Anwesend':'Abwesend'}</button></div>`).join('')}function ensureTraining(){let t=currentTraining();if(!t){t={id:uid(),date:date.value||new Date().toISOString().slice(0,10),attendance:{}};state.trainings.push(t)}return t}function toggleAttendance(id){let t=ensureTraining();t.attendance[id]=!t.attendance[id];save()}function newTraining(){date.value=new Date().toISOString().slice(0,10);ensureTraining();switchTab('trainingParticipants')}function saveTraining(){ensureTraining();save()}function renderHistory(){trainingList.innerHTML=state.trainings.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="card" onclick="trainingDetails('${t.id}')"><b>📅 ${fmt(t.date)}</b><div>${Object.values(t.attendance||{}).filter(Boolean).length} Teilnehmer · Antippen für Details</div></div>`).join('')||'<div class="form">Noch keine Trainings gespeichert.</div>'}function trainingDetails(id){let t=state.trainings.find(x=>x.id===id),ps=state.players.filter(p=>t.attendance?.[p.id]);modalTitle.textContent='Training am '+fmt(t.date);modalBody.innerHTML='<b>Teilnehmer</b><br>'+ (ps.map(p=>esc(pname(p))).join('<br>')||'Keine Teilnehmer');modal.classList.add('show')}function renderEvents(){eventList.innerHTML=state.events.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(e=>`<div class="card"><b>${fmt(e.date)} · ${esc(e.location)}</b><div>${esc(e.time)} Uhr · ${(e.players||[]).length} Teilnehmer</div><p><button class="btn" onclick="editEvent('${e.id}')">Bearbeiten / Teilnehmer</button></p></div>`).join('')||'<div class="form">Noch keine Spielfeste.</div>'}function openEvent(e){eventEditId=e?.id||null;eventForm.classList.remove('hidden');eventDate.value=e?.date||'';eventLocation.value=e?.location||'';eventTime.value=e?.time||'';eventPlayers.innerHTML=state.players.map(p=>`<label><input type="checkbox" value="${p.id}" ${(e?.players||[]).includes(p.id)?'checked':''}> ${esc(pname(p))}</label>`).join('')}function editEvent(id){openEvent(state.events.find(e=>e.id===id))}function closeEvent(){eventForm.classList.add('hidden');eventEditId=null}function saveEvent(){let e={id:eventEditId||uid(),date:eventDate.value,location:eventLocation.value,time:eventTime.value,players:[...eventPlayers.querySelectorAll('input:checked')].map(x=>x.value)};if(eventEditId){let i=state.events.findIndex(x=>x.id===eventEditId);state.events[i]=e}else state.events.push(e);closeEvent();save()}function renderOther(){let rows=state.players.slice().sort((a,b)=>pname(a).localeCompare(pname(b),'de')).map(p=>{let s=stats(p.id),percent=s.total?Math.round(s.present/s.total*100):0;return`<div class="attendance-row"><span>${esc(pname(p))}</span><span class="attendance-value">${s.present} von ${s.total} Trainings <span class="attendance-percent">(${percent}%)</span></span></div>`}).join('')||'<div class="form">Noch keine Spieler angelegt.</div>';overviewList.innerHTML=`<div class="overview-stats"><b>${state.players.length}</b> Spieler · <b>${state.trainings.length}</b> Trainings · <b>${state.events.length}</b> Spielfeste</div><div class="attendance-list"><h3>Trainingsteilnahme</h3>${rows}</div>`}function render(){renderPlayers();renderParticipants();renderHistory();renderEvents();renderOther()}function switchTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.drawer button[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));title.textContent=document.querySelector(`.drawer button[data-tab="${id}"]`)?.textContent.trim()||id;drawer.classList.remove('open');render()}function toggleMenu(){drawer.classList.toggle('open')}function closeModal(){modal.classList.remove('show')}document.querySelectorAll('.drawer button[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));search.oninput=renderPlayers;date.value=new Date().toISOString().slice(0,10);date.onchange=renderParticipants;render();</script></body></html>
