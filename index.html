<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FV Eppertshausen · G-Jugend</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:#f7f7f7;color:#171717}.top{background:linear-gradient(135deg,#fff 0 72%,#fafafa);border-bottom:1px solid #ddd}.header{max-width:1250px;margin:auto;display:flex;align-items:center;gap:22px;padding:18px 22px}.logo{width:125px;height:145px;object-fit:contain}.title h1{margin:0;color:#c71916;font-size:clamp(2rem,4vw,3.2rem)}.title h2{margin:3px 0 0;font-size:1.8rem}.sponsorBox{margin-left:auto;border:1px solid #ddd;border-radius:14px;padding:12px 22px;min-width:220px;text-align:center}.sponsorBox strong{display:block;color:#c71916;font-size:1.1rem}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 180px)}.side{background:linear-gradient(#c71916,#a50d0b);color:white;padding:18px 12px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{background:transparent;color:white;border:0;text-align:left;padding:14px 16px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer}.nav button.active,.nav button:hover{background:#8f0907}.main{padding:24px;max-width:1200px;width:100%;margin:auto}.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 14px #00000012;margin-bottom:18px}.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.field label{display:block;font-weight:700;font-size:.82rem;margin-bottom:5px}.field input,.field select,input,button{font:inherit}.field input,.field select,.search{width:100%;padding:11px;border:1px solid #d5d5d5;border-radius:9px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar h2{margin:0}.actions{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.red{background:#c71916;color:#fff}.light{background:#f1f1f1}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th{background:#c71916;color:#fff;text-align:left;padding:12px}th:first-child{border-radius:9px 0 0 0}th:last-child{border-radius:0 9px 0 0}td{padding:11px;border-bottom:1px solid #e5e5e5}.colorDot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:1px solid #aaa}.rowBtn{padding:7px 9px;border:1px solid #ddd;background:white;border-radius:7px;cursor:pointer}.danger{color:#c71916}.hidden{display:none}.training-grid{display:grid;grid-template-columns:220px 1fr;gap:16px}.dateList{display:flex;flex-direction:column;gap:7px}.dateBtn{padding:10px;border:1px solid #ddd;background:white;border-radius:8px;text-align:left;cursor:pointer}.dateBtn.active{background:#c71916;color:white}.attPresent{background:#dff5df;color:#167216;border:1px solid #9bd39b;border-radius:7px;padding:7px 10px}.attAbsent{background:#ffe2e2;color:#a00;border:1px solid #e9aaaa;border-radius:7px;padding:7px 10px}.summary{font-size:.9rem;color:#666}.footer{background:#b91210;color:white;text-align:center;padding:13px;font-size:.9rem}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{padding:8px}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}.header{flex-wrap:wrap}.sponsorBox{margin-left:0}.settings,.training-grid{grid-template-columns:1fr}.main{padding:14px}.logo{width:85px;height:100px}}@media print{.side,.noPrint{display:none!important}.layout{display:block}.main{padding:0}.panel{box-shadow:none}.top{border:0}.sponsorBox{display:block}}
</style></head><body>
<header class="top"><div class="header"><img class="logo" src="logo.svg" alt="FV Eppertshausen Logo"><div class="title"><h1>FV Eppertshausen</h1><h2>G-Jugend</h2></div><div class="sponsorBox"><strong>Sponsor</strong><span id="sponsorDisplay">Ihr Sponsor</span></div></div></header>
<div class="layout"><aside class="side"><nav class="nav"><button class="active" data-tab="jersey">👕 Trikotliste</button><button data-tab="training">📋 Trainingsteilnahme</button><button onclick="window.print()">🖨️ Drucken / PDF</button></nav></aside>
<main class="main"><section id="jersey" class="tab"><div class="panel"><h2 style="margin-top:0">Trikotdaten</h2><div class="settings"><div class="field"><label>Sponsor</label><input id="sponsor" placeholder="Sponsor eintragen"></div><div class="field"><label>Trikotfarbe</label><select id="color"><option>Rot</option><option>Weiß</option><option>Schwarz</option><option>Blau</option><option>Gelb</option><option>Sonstige</option></select></div><div class="field"><label>Aktion</label><button class="btn red" onclick="saveSettings()">Speichern</button></div></div></div>
<div class="panel noPrint"><div class="toolbar"><div><h2>Spieler</h2><div class="summary" id="count"></div></div><div class="actions"><input class="search" id="search" placeholder="🔎 Suchen..." style="width:230px"><button class="btn red" onclick="openPlayer()">＋ Spieler hinzufügen</button></div></div><div id="playerForm" class="hidden" style="margin-bottom:15px"><div class="settings"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Nr.</label><input id="number" type="number" min="0" max="99"></div><div class="field"><label>Größe</label><select id="size"><option>116</option><option>122</option><option>128</option><option>134</option><option>140</option><option>146</option><option>152</option><option>158</option><option>164</option></select></div></div><div class="actions" style="margin-top:10px"><button class="btn red" onclick="savePlayer()">Speichern</button><button class="btn light" onclick="closePlayer()">Abbrechen</button></div></div><div class="tableWrap"><table><thead><tr><th>Name</th><th>Nr.</th><th>Größe</th><th>Trikotfarbe</th><th>Aktionen</th></tr></thead><tbody id="players"></tbody></table></div></div></section>
<section id="training" class="tab hidden"><div class="panel"><div class="toolbar"><div><h2>Trainingsteilnahme</h2><div class="summary">Teilnahme pro Training erfassen</div></div><div class="actions noPrint"><input id="trainingDate" type="date"><button class="btn red" onclick="addTraining()">＋ Training hinzufügen</button></div></div><div class="training-grid"><div><h3>Trainingstermine</h3><div id="dates" class="dateList"></div></div><div><h3 id="trainingTitle">Bitte Training auswählen</h3><div id="attendance"></div></div></div></div></section></main></div><footer class="footer">⚽ FV Eppertshausen 1920 e.V. · Gemeinsam für unseren Nachwuchs!</footer>
<script>
const PKEY='fve-g-players',SKEY='fve-g-settings',TKEY='fve-g-training';let players=JSON.parse(localStorage.getItem(PKEY)||'[]'),settings=JSON.parse(localStorage.getItem(SKEY)||'{}'),training=JSON.parse(localStorage.getItem(TKEY)||'{}'),edit=-1,selectedDate=null;
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function saveAll(){localStorage.setItem(PKEY,JSON.stringify(players));localStorage.setItem(SKEY,JSON.stringify(settings));localStorage.setItem(TKEY,JSON.stringify(training))}
function colorDot(c){let x={Rot:'#d71916',Weiß:'#fff',Schwarz:'#111',Blau:'#2864c7',Gelb:'#f5c400',Sonstige:'#777'}[c]||'#777';return `<span class="colorDot" style="background:${x}"></span>${esc(c)}`}
function renderPlayers(){let q=$('search').value.toLowerCase();let rows=players.map((p,i)=>({...p,i})).filter(p=>Object.values(p).join(' ').toLowerCase().includes(q));$('players').innerHTML=rows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.number)}</td><td>${esc(p.size)}</td><td>${colorDot(settings.color||'Rot')}</td><td class="noPrint"><button class="rowBtn" onclick="editPlayer(${p.i})">✏️</button> <button class="rowBtn danger" onclick="deletePlayer(${p.i})">🗑️</button></td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;padding:25px;color:#777">Noch keine Spieler eingetragen.</td></tr>';$('count').textContent=`${players.length} Spieler eingetragen`}
function saveSettings(){settings={color:$('color').value,sponsor:$('sponsor').value.trim()};saveAll();$('sponsorDisplay').textContent=settings.sponsor||'Ihr Sponsor';renderPlayers()}
function openPlayer(){edit=-1;$('name').value='';$('number').value='';$('size').value='116';$('playerForm').classList.remove('hidden')};function closePlayer(){$('playerForm').classList.add('hidden')}
function savePlayer(){let p={name:$('name').value.trim(),number:$('number').value,size:$('size').value};if(!p.name||p.number===''){alert('Bitte Name und Nummer eingeben.');return}if(edit<0)players.push(p);else players[edit]=p;saveAll();closePlayer();renderPlayers();renderTraining()}
function editPlayer(i){edit=i;let p=players[i];$('name').value=p.name;$('number').value=p.number;$('size').value=p.size;$('playerForm').classList.remove('hidden')};function deletePlayer(i){if(confirm('Spieler wirklich löschen?')){players.splice(i,1);saveAll();renderPlayers();renderTraining()}}
function addTraining(){let d=$('trainingDate').value;if(!d){alert('Bitte Datum auswählen.');return}if(!training[d])training[d]=players.map(p=>({name:p.name,present:false}));selectedDate=d;saveAll();renderTraining()}
function renderTraining(){let dates=Object.keys(training).sort().reverse();$('dates').innerHTML=dates.map(d=>`<button class="dateBtn ${d===selectedDate?'active':''}" onclick="selectTraining('${d}')">${new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}</button>`).join('')||'<span class="summary">Noch keine Termine.</span>';if(!selectedDate||!training[selectedDate]){$('trainingTitle').textContent='Bitte Training auswählen';$('attendance').innerHTML='';return}let list=training[selectedDate];$('trainingTitle').textContent='Training am '+new Date(selectedDate+'T12:00').toLocaleDateString('de-DE');$('attendance').innerHTML=`<div class="tableWrap"><table><thead><tr><th>Spieler</th><th>Teilnahme</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${esc(p.name)}</td><td><button class="${p.present?'attPresent':'attAbsent'}" onclick="toggleAttendance(${i})">${p.present?'✓ Anwesend':'✕ Nicht anwesend'}</button></td></tr>`).join('')}</tbody></table></div><p class="summary">Anwesend: ${list.filter(p=>p.present).length} von ${list.length}</p>`}
function selectTraining(d){selectedDate=d;renderTraining()}function toggleAttendance(i){training[selectedDate][i].present=!training[selectedDate][i].present;saveAll();renderTraining()}
$('search').oninput=renderPlayers;document.querySelectorAll('.nav button[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='training')renderTraining()});$('sponsor').value=settings.sponsor||'';$('color').value=settings.color||'Rot';$('sponsorDisplay').textContent=settings.sponsor||'Ihr Sponsor';renderPlayers();renderTraining();
</script></body></html>
