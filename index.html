<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FV Eppertshausen · G-Jugend Trikotliste</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}.top{background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:24px 16px}.wrap{max-width:1150px;margin:auto;padding:18px 16px}.brand{display:flex;gap:14px;align-items:center}.badge{width:56px;height:56px;border-radius:16px;background:#fff;color:#111827;display:grid;place-items:center;font-size:28px}.top h1{margin:0;font-size:1.55rem}.muted{color:#6b7280;font-size:.88rem}.top .muted{color:#d1d5db}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 22px #0000000c;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border-radius:14px;padding:16px}.stat b{display:block;font-size:1.5rem}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}label{font-size:.78rem;font-weight:700;color:#374151}input,select,button{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit}button{cursor:pointer;font-weight:700}.primary{background:#111827;color:#fff;border:0}.secondary{background:#fff}.danger{background:#fee2e2;color:#991b1b;border:0;width:auto}.actions{display:flex;gap:8px;margin-top:12px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar input{max-width:300px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #e5e7eb}th{font-size:.78rem;color:#6b7280;text-transform:uppercase}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:.78rem}.row-actions{white-space:nowrap}.row-actions button{width:auto;padding:7px 9px}.empty{text-align:center;padding:28px;color:#6b7280}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media print{.no-print{display:none!important}.top{background:#fff;color:#000;padding:10px 0}.wrap{padding:0}.card,.stat{box-shadow:none;border:1px solid #ddd}.stats{display:none}body{background:#fff}table{min-width:0}}
</style></head><body>
<header class="top"><div class="wrap" style="padding-top:0;padding-bottom:0"><div class="brand"><div class="badge">⚽</div><div><h1>FV Eppertshausen · G-Jugend</h1><div class="muted">Trikotliste &amp; Ausstattung</div></div></div></div></header>
<main class="wrap"><div class="stats no-print"><div class="stat">Spieler<b id="sPlayers">0</b></div><div class="stat">Nummern<b id="sNumbers">0</b></div><div class="stat">Größen<b id="sSizes">0</b></div><div class="stat">Sponsoren<b id="sSponsors">0</b></div></div>
<section class="card no-print"><h2>Spieler hinzufügen / bearbeiten</h2><form id="form"><div class="grid"><div><label>Name</label><input id="name" required placeholder="Vorname Nachname"></div><div><label>Nr.</label><input id="number" type="number" min="0" max="99" required placeholder="10"></div><div><label>Größe</label><select id="size"><option>116</option><option>122</option><option>128</option><option>134</option><option>140</option><option>146</option><option>152</option><option>158</option><option>164</option></select></div><div><label>Trikotfarbe</label><select id="color"><option>Rot</option><option>Weiß</option><option>Schwarz</option><option>Blau</option><option>Sonstige</option></select></div><div><label>Allgemein</label><input id="general" placeholder="z. B. Torwart"></div><div><label>Sponsor</label><input id="sponsor" placeholder="Sponsor"></div></div><div class="actions"><button class="primary" type="submit">Speichern</button><button class="secondary" type="button" id="cancel" hidden>Abbrechen</button></div></form></section>
<section class="card"><div class="toolbar"><div><h2 style="margin:0">Trikotliste</h2><div class="muted">Übersichtlich für Trainer, Eltern und Bestellung</div></div><div class="no-print" style="display:flex;gap:8px"><input id="search" placeholder="🔎 Suche..."><button class="secondary" onclick="window.print()">🖨️ Drucken / PDF</button></div></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Nr.</th><th>Größe</th><th>Trikotfarbe</th><th>Allgemein</th><th>Sponsor</th><th class="no-print"></th></tr></thead><tbody id="list"></tbody></table></div><p class="muted" id="count"></p></section></main>
<script>const KEY='fv-eppertshausen-g-trikotliste';let players=JSON.parse(localStorage.getItem(KEY)||'[]'),editIndex=-1;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function save(){localStorage.setItem(KEY,JSON.stringify(players));render()}function render(){const q=$('search').value.toLowerCase();const rows=players.map((p,i)=>({...p,i})).filter(p=>Object.values(p).join(' ').toLowerCase().includes(q));$('list').innerHTML=rows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td><span class="pill">${esc(p.number)}</span></td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td>${esc(p.general)}</td><td>${esc(p.sponsor)}</td><td class="no-print row-actions"><button onclick="edit(${p.i})">✏️</button> <button class="danger" onclick="removePlayer(${p.i})">🗑️</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Noch keine Spieler eingetragen.</td></tr>';$('count').textContent=`${players.length} Spieler eingetragen`;$('sPlayers').textContent=players.length;$('sNumbers').textContent=new Set(players.map(p=>p.number)).size;$('sSizes').textContent=new Set(players.map(p=>p.size)).size;$('sSponsors').textContent=new Set(players.map(p=>p.sponsor).filter(Boolean)).size}$('form').onsubmit=e=>{e.preventDefault();const p={name:$('name').value.trim(),number:$('number').value,size:$('size').value,color:$('color').value,general:$('general').value.trim(),sponsor:$('sponsor').value.trim()};if(editIndex<0)players.push(p);else players[editIndex]=p;editIndex=-1;$('form').reset();$('cancel').hidden=true;save()};window.edit=i=>{const p=players[i];['name','number','size','color','general','sponsor'].forEach(k=>$(k).value=p[k]);editIndex=i;$('cancel').hidden=false;scrollTo({top:0,behavior:'smooth'})};window.removePlayer=i=>{if(confirm(`Eintrag von ${players[i].name} löschen?`)){players.splice(i,1);save()}};$('cancel').onclick=()=>{editIndex=-1;$('form').reset();$('cancel').hidden=true};$('search').oninput=render;render();</script></body></html>
